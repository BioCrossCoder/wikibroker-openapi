[package]
name = "wikibroker_openapi_sdk"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
chrono = "0.4.45"
hex = "0.4.3"
hmac = "0.13.0"
http = "1.4.2"
reqwest = { version = "0.13.4", features = ["json"], optional = true }
sha2 = "0.11.0"
ureq = { version = "3.3.0", features = ["json"], optional = true }
url = "2.5.8"
uuid = { version = "1.23.3", features = ["v4"] }

[features]
reqwest = ["dep:reqwest"]
ureq = ["dep:ureq"]

[dev-dependencies]
tokio = { version = "1.52.3", features = ["full"] }
